# 타일을 더 작은 레벨로 나누는 거리 배수. 타일 한 변 x detail 보다 가까우면 분할한다.
detail: 2.0
# 셀 한 변 = 2^level 블록. 최대 7.
min-level: 0
max-level: 6
# 클라이언트 far plane(렌더 거리 x 4)과 이 값 중 작은 쪽까지 그린다.
max-distance: 1024
# 디스플레이 앵커를 두는 격자 간격(블록). 최대 셀 크기(2^max-level)의 배수로 맞춰지고, 그 3/4 거리는 서버 display 엔티티 추적 거리보다 작아야 한다.
anchor-grid: 128
update-interval-ticks: 10
builds-per-update: 8
pregen-parallel: 8
save-interval-minutes: 5
