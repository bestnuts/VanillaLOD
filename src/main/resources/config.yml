# 타일을 더 작은 레벨로 나누는 거리 배수. 타일 한 변 x detail 보다 가까우면 분할한다.
detail: 2.0
# 셀 한 변 = 2^level 블록. 최대 7.
min-level: 0
max-level: 6
# LOD 최대 거리 상한(블록). 기본은 유효 렌더 거리 x 3.9(포그 끝)까지 그리며, 이보다 작게 잡으면 포그 전에 LOD가 끊긴다.
max-distance: 4096
# 디스플레이 앵커를 두는 격자 간격(블록). 최대 셀 크기(2^max-level)의 배수로 맞춰지고, 그 3/4 거리는 서버 display 엔티티 추적 거리보다 작아야 한다.
anchor-grid: 128
update-interval-ticks: 10
builds-per-update: 8
pregen-parallel: 8
save-interval-minutes: 5
# 플레이어 LOD 범위 안에서 캐시에 없는 청크를 가까운 순으로 자동 로드한다.
auto-fill: true
# 아직 생성되지 않은 청크까지 생성할지. 끄면 이미 생성된 청크만 읽는다.
auto-fill-generate: true
auto-fill-interval-ticks: 100
# 자동 채우기가 청크 로드 큐에 쌓아 둘 최대 요청 수.
auto-fill-queue: 256
